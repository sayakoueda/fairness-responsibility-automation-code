[project]
name = "oekaki-behavioural-exp"
version = "0.9.6"
description = "Drawing-task behavioral experiment program"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Sayako Ueda" },
    { name = "Shun Sasaki" },
]
keywords = [ "behavioral-experiment"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pygame>=2.5",
    "scipy>=1.10",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oekaki_behavioural_exp"]

[tool.pytest.ini_options]
# tests/conftest.py also tweaks sys.path; mirror it here so pytest discovery works without it.
pythonpath = ["src"]
